<div class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">J</span>
      <span class="brand-text" *ngIf="!isCollapsed">JetFood</span>
    </div>
    <button (click)="toggle()" class="toggle-btn" [attr.aria-label]="i18n.t('toggleSidebar')" [title]="i18n.t('toggleSidebar')">
      <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><path [attr.d]="isCollapsed ? 'm9 6 6 6-6 6' : 'm15 6-6 6 6 6'" /></svg>
    </button>
  </div>

  <div class="sidebar-user" *ngIf="!isCollapsed">
    <div class="user-avatar">
      {{ currentUser?.username?.charAt(0).toUpperCase() }}
    </div>
    <div class="user-info">
      <div class="user-name">{{ currentUser?.username }}</div>
      <div class="user-role">{{ roleLabel(currentUser?.role) }}</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of visibleMenuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      [attr.aria-label]="i18n.t(item.label)"
      [title]="i18n.t(item.label)"
      class="nav-item"
    >
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><path *ngIf="item.icon === 'dashboard'" d="M3 10 12 3l9 7v11h-6v-7H9v7H3z" /><path *ngIf="item.icon === 'profile'" d="M20 21v-2a8 8 0 0 0-16 0v2 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8" /><path *ngIf="item.icon === 'payments'" d="M3 5h18v14H3z M3 9h18 M7 15h3" /><path *ngIf="item.icon === 'restaurants'" d="M4 3v6a3 3 0 0 0 6 0V3 M7 3v18 M20 21V3c-5 2-5 10 0 10" /><path *ngIf="item.icon === 'orders'" d="M5 3h14v18l-3-2-4 2-4-2-3 2z M8 7h8 M8 11h8 M8 15h4" /><path *ngIf="item.icon === 'analytics'" d="M3 3v18h18 M7 17v-5h3v5 M13 17V8h3v9 M19 17V5h2v12" /><path *ngIf="item.icon === 'reports'" d="M5 3h10l4 4v14H5z M14 3v5h5 M8 12h8 M8 16h8" /><path *ngIf="item.icon === 'integration'" d="m10 13 4-4 M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0 M16 8l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" /><path *ngIf="item.icon === 'notifications'" d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10 M10 21h4" /></svg></span>
      <span class="nav-label" *ngIf="!isCollapsed">{{ i18n.t(item.label) }}</span>
    </a>

    <a
      *ngIf="currentUser?.role === 'admin'"
      routerLink="/admin"
      routerLinkActive="active"
      [attr.aria-label]="i18n.t('admin')"
      [title]="i18n.t('admin')"
      class="nav-item admin-item"
    >
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6z m-5 10 3 3 5-6" /></svg></span>
      <span class="nav-label" *ngIf="!isCollapsed">{{ i18n.t('admin') }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" (click)="logout()" class="logout-btn" [attr.aria-label]="i18n.t('logout')" [title]="i18n.t('logout')">
      <span class="logout-icon"><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><path d="M9 21H3V3h6 M9 12h12 m-4-4 4 4-4 4" /></svg></span>
      <span *ngIf="!isCollapsed">{{ i18n.t('logout') }}</span>
    </button>
  </div>
</div>
